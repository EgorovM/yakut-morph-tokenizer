[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yakut-morph-tokenizer"
version = "0.1.0"
description = "Morphological segmenter and morphology-aware subword tokenizer for Sakha (Yakut)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tokenizers>=0.20"]

[project.optional-dependencies]
experiments = ["torch>=2.4", "numpy", "morfessor", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
